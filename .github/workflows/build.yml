name: Build & Publish CloudStream

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: cloudstream-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.14.4"

      - name: Build AfterDark and Frembed
        run: |
          gradle :AfterDark:make :Frembed:make makePluginsJson --stacktrace

      - name: Prepare builds branch contents
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/cloudstream-publish
          mkdir -p /tmp/cloudstream-publish

          find AfterDark/build Frembed/build -maxdepth 1 -type f -name '*.cs3' \
            -exec cp -v {} /tmp/cloudstream-publish/ \;

          find AfterDark/build Frembed/build -maxdepth 1 -type f -name '*.jar' \
            -exec cp -v {} /tmp/cloudstream-publish/ \;

          cp -v build/plugins.json /tmp/cloudstream-publish/plugins.json
          cp -v repo.json /tmp/cloudstream-publish/repo.json

          CS3_COUNT="$(find /tmp/cloudstream-publish -maxdepth 1 -type f -name '*.cs3' | wc -l)"
          if [ "$CS3_COUNT" -lt 2 ]; then
            echo "ERROR: expected at least 2 .cs3 files, found $CS3_COUNT"
            find /tmp/cloudstream-publish -maxdepth 1 -type f -print
            exit 1
          fi

          test -s /tmp/cloudstream-publish/plugins.json
          test -s /tmp/cloudstream-publish/repo.json

          echo "=== Files that will be published ==="
          ls -lah /tmp/cloudstream-publish

          echo "=== plugins.json ==="
          cat /tmp/cloudstream-publish/plugins.json

      - name: Publish to builds branch
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch --orphan builds
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          cp -av /tmp/cloudstream-publish/. .

          git add -A
          git commit -m "Publish CloudStream ${GITHUB_SHA::7}"
          git push --force origin builds

      - name: Upload CS3 artifacts
        uses: actions/upload-artifact@v6
        with:
          name: CloudStream-Extensions
          if-no-files-found: error
          path: /tmp/cloudstream-publish/*.cs3
