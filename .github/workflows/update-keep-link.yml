name: Update KeepLink redirect

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-keep-link-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-link:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Resolve the current address
        id: keep-link
        shell: bash
        run: |
          set -euo pipefail

          file="KeepLink.txt"
          if [[ ! -f "$file" ]]; then
            echo "::error file=$file::KeepLink.txt does not exist"
            exit 1
          fi

          current_url="$(awk 'NF { sub(/\r$/, ""); print; exit }' "$file")"

          # Extracts "https://host/" from any https:// URL. No domain or
          # brand restriction here: whether we go looking for a new link at
          # all is decided purely by the announcement text on the page.
          url_origin() {
            local value="$1"

            if [[ ! "$value" =~ ^https://([^/:?#]+)([/?#]|$) ]]; then
              return 1
            fi

            printf 'https://%s/\n' "${BASH_REMATCH[1],,}"
          }

          if ! current_origin="$(url_origin "$current_url")"; then
            echo "::error file=$file::KeepLink.txt must contain a valid https:// URL"
            exit 1
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          fetch_page() {
            local requested_url="$1"
            local curl_output

            if ! curl_output="$(
              curl \
                --silent \
                --show-error \
                --location \
                --max-redirs 10 \
                --connect-timeout 15 \
                --max-time 60 \
                --retry 2 \
                --retry-delay 2 \
                --retry-all-errors \
                --proto '=https' \
                --proto-redir '=https' \
                --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152 Safari/537.36' \
                --header 'Accept: text/html,application/xhtml+xml;q=0.9,*/*;q=0.8' \
                --header 'Cache-Control: no-cache' \
                --output "$body_file" \
                --write-out $'%{url_effective}\n%{http_code}' \
                "$requested_url"
            )"; then
              return 1
            fi

            effective_url="$(sed -n '1p' <<< "$curl_output")"
            status_code="$(sed -n '2p' <<< "$curl_output")"
          }

          resolved_url=""
          candidate_url="$current_origin"

          # A page is only ever treated as "announcing a move" if it contains
          # one of these exact phrases. If it doesn't, the page is treated as
          # the final, live address and nothing further is followed.
          for _ in {1..8}; do
            if ! fetch_page "$candidate_url"; then
              echo "The current URL could not be reached; KeepLink.txt is unchanged."
              exit 0
            fi

            if [[ ! "$status_code" =~ ^2[0-9][0-9]$ ]]; then
              echo "Final HTTP status is $status_code; KeepLink.txt is unchanged."
              exit 0
            fi

            if ! effective_origin="$(url_origin "$effective_url")"; then
              echo "::warning::The effective URL could not be parsed."
              exit 0
            fi

            if ! grep -Eiq \
              "a changé d'adresse|ancienne adresse n'est plus utilisée|redirection dans [0-9]+s" \
              "$body_file"; then
              # No announcement on this page: it's the final, live address.
              resolved_url="$effective_origin"
              break
            fi

            discovered_urls="$(
              sed \
                -e 's#\\/#/#g' \
                -e 's#\\u002[fF]#/#g' \
                "$body_file" |
                grep -Eio "https?://[a-z0-9.-]+\.[a-z]{2,}(/[^\"'<>[:space:]]*)?" |
                awk '!seen[tolower($0)]++' || true
            )"

            next_url=""
            while IFS= read -r discovered_url; do
              [[ -n "$discovered_url" ]] || continue

              if discovered_origin="$(url_origin "${discovered_url,,}")" &&
                 [[ "$discovered_origin" != "$effective_origin" ]]; then
                next_url="$discovered_origin"
                break
              fi
            done <<< "$discovered_urls"

            if [[ -z "$next_url" ]]; then
              echo "The page announces a move but exposes no usable link; KeepLink.txt is unchanged."
              exit 0
            fi

            echo "Found a redirect announcement: $effective_origin -> $next_url"
            candidate_url="$next_url"
          done

          if [[ -z "$resolved_url" ]]; then
            echo "Too many consecutive redirect announcements; KeepLink.txt is unchanged."
            exit 0
          fi

          if [[ "$resolved_url" == "$current_url" ]]; then
            echo "KeepLink.txt is already current: $current_url"
            exit 0
          fi

          printf '%s\n' "$resolved_url" > "$file"
          echo "old_url=$current_url" >> "$GITHUB_OUTPUT"
          echo "new_url=$resolved_url" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated URL
        if: steps.keep-link.outputs.changed == 'true'
        shell: bash
        env:
          OLD_URL: ${{ steps.keep-link.outputs.old_url }}
          NEW_URL: ${{ steps.keep-link.outputs.new_url }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- KeepLink.txt
          git commit -m "chore: update KeepLink redirect"
          git push
          echo "Updated $OLD_URL -> $NEW_URL"
