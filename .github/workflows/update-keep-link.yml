name: Update KeepLink redirects

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-keep-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Route resolver traffic through Cloudflare WARP
        uses: fscarmen/warp-on-actions@37ce1997e075435a827991dabcce1d080c1fe512
        with:
          stack: dual
          mode: client

      - name: Verify Cloudflare WARP connection
        shell: bash
        run: |
          set -euo pipefail

          # Match the working device configuration: all traffic and DNS are
          # already enabled by warp+doh; WireGuard forces the UDP tunnel.
          sudo warp-cli --accept-tos tunnel protocol set WireGuard
          sudo warp-cli --accept-tos disconnect || true
          sudo warp-cli --accept-tos connect

          for attempt in {1..20}; do
            echo "WARP check $attempt/20"
            sudo warp-cli --accept-tos status || true

            trace="$(
              curl \
                --silent \
                --show-error \
                --connect-timeout 5 \
                --max-time 10 \
                https://www.cloudflare.com/cdn-cgi/trace ||
              true
            )"

            if grep -Eq '^warp=(on|plus)$' <<< "$trace"; then
              echo "Cloudflare WARP is active."
              grep -E '^(ip|loc|colo|warp)=' <<< "$trace" || true
              exit 0
            fi

            sleep 2
          done

          echo "::error::Cloudflare WARP did not become active"
          exit 1

      - name: Install browser HTTP client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check curl-cffi selenium

      - name: Resolve all KeepLink files
        id: keep-links
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(KeepLink*.txt)
          shopt -u nullglob

          if (( ${#files[@]} == 0 )); then
            echo "::error::No KeepLink*.txt file was found"
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          url_origin() {
            local value="$1"

            if [[ ! "$value" =~ ^https://([^/:?#]+)([/?#]|$) ]]; then
              return 1
            fi

            printf 'https://%s/\n' "${BASH_REMATCH[1],,}"
          }

          fetch_page() {
            local requested_url="$1"
            local body_file="$2"

            # A User-Agent alone does not make curl behave like Chrome: the TLS
            # and HTTP/2 fingerprints still identify libcurl. curl-cffi sends a
            # genuine browser network fingerprint while keeping this resolver
            # fully driven by the URL stored in each KeepLink file.
            if ! fetch_output="$(
              python3 - "$requested_url" "$body_file" <<'PY'
          import sys
          import time
          from urllib.parse import urlparse

          from curl_cffi import requests
          from curl_cffi.const import CurlIpResolve, CurlOpt


          def fetch_with_chrome(url):
              from selenium import webdriver
              from selenium.webdriver.chrome.options import Options

              options = Options()
              options.add_argument("--headless=new")
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              options.add_argument("--disable-blink-features=AutomationControlled")
              options.add_argument("--lang=fr-FR")
              options.add_argument("--window-size=1365,768")
              options.add_experimental_option(
                  "excludeSwitches",
                  ["enable-automation"],
              )
              options.add_experimental_option("useAutomationExtension", False)

              driver = webdriver.Chrome(options=options)
              try:
                  driver.set_page_load_timeout(60)
                  browser = driver.execute_cdp_cmd("Browser.getVersion", {})
                  user_agent = browser["userAgent"].replace(
                      "HeadlessChrome/",
                      "Chrome/",
                  )
                  driver.execute_cdp_cmd(
                      "Network.setUserAgentOverride",
                      {
                          "userAgent": user_agent,
                          "acceptLanguage": "fr-FR,fr;q=0.9,en;q=0.7",
                          "platform": "Linux x86_64",
                      },
                  )
                  driver.execute_cdp_cmd(
                      "Page.addScriptToEvaluateOnNewDocument",
                      {
                          "source": (
                              "Object.defineProperty(navigator, 'webdriver', "
                              "{get: () => undefined});"
                          ),
                      },
                  )
                  driver.get(url)

                  # Allow a JavaScript challenge or client redirect to finish.
                  deadline = time.monotonic() + 20
                  while time.monotonic() < deadline:
                      title = driver.title.lower()
                      source = driver.page_source.lower()
                      challenge = (
                          "just a moment" in title
                          or "checking your browser" in source
                          or "cf-chl-" in source
                      )
                      if not challenge:
                          break
                      time.sleep(1)

                  status = driver.execute_script(
                      "const nav = performance.getEntriesByType('navigation')[0];"
                      "return nav ? nav.responseStatus : 0;"
                  )
                  return (
                      driver.current_url,
                      int(status or 0),
                      driver.page_source.encode("utf-8"),
                  )
              finally:
                  driver.quit()

          def fetch_with_family(url, family, label):
              last_error = None

              for attempt in range(1, 3):
                  try:
                      response = requests.get(
                          url,
                          impersonate="chrome",
                          headers={
                              "Accept": "text/html,application/xhtml+xml;q=0.9,*/*;q=0.8",
                              "Accept-Language": "fr-FR,fr;q=0.9,en;q=0.7",
                          },
                          curl_options={CurlOpt.IPRESOLVE: family},
                          allow_redirects=True,
                          timeout=60,
                      )
                  except requests.RequestsError as error:
                      last_error = error
                      if attempt < 2:
                          time.sleep(attempt * 2)
                      continue

                  ray = response.headers.get("cf-ray", "absent")
                  print(
                      f"WARP {label}: HTTP {response.status_code}; CF-Ray={ray}",
                      file=sys.stderr,
                  )
                  if response.status_code != 429 and response.status_code < 500:
                      return response
                  if attempt < 2:
                      time.sleep(attempt * 2)

              if last_error is not None:
                  print(
                      f"WARP {label}: {type(last_error).__name__}",
                      file=sys.stderr,
                  )
              return None


          requested_url, body_file = sys.argv[1:]
          response = None

          # Test both WARP addresses explicitly. A block on one egress family
          # must not hide a working path on the other one.
          for family, label in (
              (CurlIpResolve.V6, "IPv6"),
              (CurlIpResolve.V4, "IPv4"),
          ):
              candidate = fetch_with_family(requested_url, family, label)
              if candidate is None:
                  continue
              response = candidate
              if candidate.status_code != 403:
                  break

          if response is None:
              raise RuntimeError("No HTTP response")

          if response.status_code == 403:
              final_url, status_code, content = fetch_with_chrome(requested_url)
              print(
                  f"WARP Chrome: HTTP {status_code}",
                  file=sys.stderr,
              )
              redirect_urls = [requested_url, final_url]
          else:
              final_url = response.url
              status_code = response.status_code
              content = response.content
              if len(response.history) > 10:
                  raise RuntimeError("Too many redirects")
              redirect_urls = [item.url for item in [*response.history, response]]

          if any(urlparse(url).scheme != "https" for url in redirect_urls):
              raise RuntimeError("Refusing a non-HTTPS redirect")

          with open(body_file, "wb") as output:
              output.write(content)

          print(final_url)
          print(status_code)
          PY
            )"; then
              return 1
            fi

            effective_url="$(sed -n '1p' <<< "$fetch_output")"
            status_code="$(sed -n '2p' <<< "$fetch_output")"
          }

          page_announces_move() {
            local body_file="$1"

            python3 - "$body_file" <<'PY'
          import html
          import re
          import sys
          import unicodedata

          with open(sys.argv[1], "r", encoding="utf-8", errors="ignore") as file:
              source = file.read()

          source = html.unescape(source)
          source = source.replace("\\/", "/")
          source = re.sub(r"\\u002f", "/", source, flags=re.I)

          normalized = unicodedata.normalize("NFKD", source)
          normalized = "".join(
              character for character in normalized
              if not unicodedata.combining(character)
          ).lower()

          patterns = [
              r"a\s+change\s+d['’]adresse",
              r"ancienne\s+adresse\s+n['’]est\s+plus\s+utilisee",
              r"redirection\s+dans\s+[0-9]+\s*s",
              r"nouvelle\s+adresse",
              r"url\s+en\s+vigueur",
              r"ouvrir\s+le\s+site",
          ]

          found = any(re.search(pattern, normalized) for pattern in patterns)
          raise SystemExit(0 if found else 1)
          PY
          }

          extract_announced_target() {
            local body_file="$1"
            local base_url="$2"

            python3 - "$body_file" "$base_url" <<'PY'
          import html
          import re
          import sys
          import unicodedata
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          filename = sys.argv[1]
          base_url = sys.argv[2]

          with open(filename, "r", encoding="utf-8", errors="ignore") as file:
              source = file.read()

          source = html.unescape(source)
          source = source.replace("\\/", "/")
          source = re.sub(r"\\u002f", "/", source, flags=re.I)

          def normalize(value):
              value = unicodedata.normalize("NFKD", value)
              value = "".join(
                  character for character in value
                  if not unicodedata.combining(character)
              )
              return " ".join(value.lower().split())

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.current_link = None
                  self.links = []
                  self.text = []
                  self.refreshes = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  tag = tag.lower()

                  if tag == "a":
                      self.current_link = {
                          "href": attributes.get("href", ""),
                          "text": [],
                      }

                  if (
                      tag == "meta"
                      and attributes.get("http-equiv", "").lower() == "refresh"
                  ):
                      self.refreshes.append(attributes.get("content", ""))

              def handle_data(self, data):
                  self.text.append(data)

                  if self.current_link is not None:
                      self.current_link["text"].append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self.current_link is not None:
                      self.links.append((
                          self.current_link["href"],
                          " ".join(self.current_link["text"]),
                      ))
                      self.current_link = None

          parser = PageParser()
          parser.feed(source)

          candidates = []
          candidate_index = 0

          def add_candidate(value, priority):
              global candidate_index

              value = html.unescape(value).strip()
              value = value.rstrip("\"'<>),.;")

              if not value:
                  return

              candidates.append((
                  priority,
                  candidate_index,
                  urljoin(base_url, value),
              ))
              candidate_index += 1

          # Boutons explicitement destinés à ouvrir la nouvelle adresse.
          preferred_labels = (
              "ouvrir le site",
              "acceder au site",
              "visiter le site",
              "continuer vers le site",
          )

          for href, label in parser.links:
              normalized_label = normalize(label)

              if any(text in normalized_label for text in preferred_labels):
                  add_candidate(href, 1000)

          # Adresse écrite après les indications AfterDark.
          visible_text = " ".join(parser.text)

          for pattern in (
              r"url\s+en\s+vigueur.{0,250}?(https://[a-z0-9.-]+)",
              r"nouvelle\s+adresse.{0,250}?(https://[a-z0-9.-]+)",
          ):
              for match in re.finditer(pattern, visible_text, re.I | re.S):
                  add_candidate(match.group(1), 900)

          # Redirections HTML.
          for refresh in parser.refreshes:
              match = re.search(r"url\s*=\s*([^;]+)", refresh, re.I)

              if match:
                  add_candidate(match.group(1), 850)

          # Redirections JavaScript utilisées par certaines anciennes pages.
          javascript_patterns = (
              r"(?:window\.)?location(?:\.href)?\s*=\s*['\"](https://[^'\"]+)",
              r"location\.replace\(\s*['\"](https://[^'\"]+)",
              r"location\.assign\(\s*['\"](https://[^'\"]+)",
          )

          for pattern in javascript_patterns:
              for match in re.finditer(pattern, source, re.I):
                  add_candidate(match.group(1), 800)

          # Liens HTML ordinaires.
          for href, _ in parser.links:
              if href:
                  add_candidate(href, 500)

          # Dernier recours : toutes les URL HTTPS présentes dans la page.
          for match in re.finditer(
              r"https://[a-z0-9.-]+\.[a-z]{2,}(?:/[^\s\"'<>]*)?",
              source,
              re.I,
          ):
              add_candidate(match.group(0), 100)

          base_host = (urlparse(base_url).hostname or "").lower()

          for _, _, candidate in sorted(
              candidates,
              key=lambda item: (-item[0], item[1]),
          ):
              parsed = urlparse(candidate)

              if parsed.scheme != "https" or not parsed.hostname:
                  continue

              candidate_host = parsed.hostname.lower()

              if candidate_host == base_host:
                  continue

              # Évite les liens sociaux présents sur les pages d'annonce.
              if candidate_host in {
                  "t.me",
                  "telegram.me",
                  "facebook.com",
                  "www.facebook.com",
                  "instagram.com",
                  "www.instagram.com",
                  "discord.gg",
              }:
                  continue

              port = f":{parsed.port}" if parsed.port else ""
              print(f"https://{candidate_host}{port}/")
              sys.exit(0)

          sys.exit(1)
          PY
          }

          resolve_file() {
            local file="$1"
            local current_url
            local current_origin
            local candidate_url
            local effective_origin
            local next_url
            local resolved_url=""
            local body_file="$temp_dir/${file//\//_}.html"
            local -A visited=()

            current_url="$(
              awk 'NF {
                sub(/\r$/, "")
                print
                exit
              }' "$file"
            )"

            if ! current_origin="$(url_origin "$current_url")"; then
              echo "::error file=$file::$file must contain a valid HTTPS URL"
              return 1
            fi

            candidate_url="$current_origin"

            for _ in {1..8}; do
              if [[ -n "${visited[$candidate_url]+present}" ]]; then
                echo "::warning file=$file::Redirect loop detected at $candidate_url"
                return 0
              fi

              visited["$candidate_url"]=1

              if ! fetch_page "$candidate_url" "$body_file"; then
                echo "$file: $candidate_url could not be reached; unchanged."
                return 0
              fi

              if [[ ! "$status_code" =~ ^2[0-9][0-9]$ ]]; then
                echo "$file: HTTP $status_code; unchanged."
                return 0
              fi

              if ! effective_origin="$(url_origin "$effective_url")"; then
                echo "::warning file=$file::Effective URL could not be parsed"
                return 0
              fi

              # Une véritable redirection HTTP a déjà été suivie par le client.
              # Si la page obtenue n'annonce aucun autre déplacement, elle
              # devient immédiatement l'adresse finale.
              if ! page_announces_move "$body_file"; then
                resolved_url="$effective_origin"
                break
              fi

              next_url="$(
                extract_announced_target "$body_file" "$effective_url" ||
                true
              )"

              if [[ -z "$next_url" ]]; then
                echo "$file: move announced but no usable target found; unchanged."
                return 0
              fi

              echo "$file: announcement found: $effective_origin -> $next_url"
              candidate_url="$next_url"
            done

            if [[ -z "$resolved_url" ]]; then
              echo "$file: too many consecutive announcements; unchanged."
              return 0
            fi

            if [[ "$resolved_url" == "$current_url" ]]; then
              echo "$file is already current: $current_url"
              return 0
            fi

            printf '%s\n' "$resolved_url" > "$file"
            echo "$file updated: $current_url -> $resolved_url"
          }

          failed=false

          for file in "${files[@]}"; do
            echo "Checking $file"

            if ! resolve_file "$file"; then
              failed=true
            fi
          done

          if [[ "$failed" == true ]]; then
            exit 1
          fi

          if git diff --quiet -- "${files[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated URLs
        if: steps.keep-links.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- KeepLink*.txt
          git commit -m "chore: update KeepLink redirects"
          git push
