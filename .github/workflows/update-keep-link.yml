name: Update KeepLink redirects

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-keep-links-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-links:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install and start Tor proxy
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            tor \
            tor-geoipdb

          sudo tee --append /etc/tor/torrc > /dev/null <<'TORRC'

          # KeepLink resolver proxy
          SocksPort 9050 IsolateSOCKSAuth
          ExitNodes {fr},{be},{ch},{lu},{de},{nl},{es},{it}
          StrictNodes 1
          AvoidDiskWrites 1
          TORRC

          sudo tor --verify-config --hush -f /etc/tor/torrc
          sudo systemctl restart tor@default

          for attempt in {1..30}; do
            if trace="$(
              curl \
                --silent \
                --show-error \
                --proxy socks5h://127.0.0.1:9050 \
                --connect-timeout 10 \
                --max-time 20 \
                https://www.cloudflare.com/cdn-cgi/trace
            )"; then
              echo "Tor proxy is active."
              grep -E '^(ip|loc|colo|warp)=' <<< "$trace" || true
              break
            fi

            if (( attempt == 30 )); then
              echo "::error::Tor proxy did not become active"
              exit 1
            fi

            sleep 2
          done

          python3 -m pip install --disable-pip-version-check curl-cffi selenium

      - name: Resolve all KeepLink files
        id: keep-links
        shell: bash
        run: |
          set -euo pipefail
          echo "Resolver revision: explicit-route-following-v6"

          shopt -s nullglob
          files=(KeepLink*.txt)
          shopt -u nullglob

          if (( ${#files[@]} == 0 )); then
            echo "::error::No KeepLink*.txt file was found"
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          url_origin() {
            local value="$1"

            if [[ ! "$value" =~ ^https://([^/:?#]+)([/?#]|$) ]]; then
              return 1
            fi

            printf 'https://%s/\n' "${BASH_REMATCH[1],,}"
          }

          fetch_page() {
            local requested_url="$1"
            local body_file="$2"

            # A User-Agent alone does not make curl behave like Chrome: the TLS
            # and HTTP/2 fingerprints still identify libcurl. curl-cffi sends a
            # genuine browser network fingerprint while keeping this resolver
            # fully driven by the URL stored in each KeepLink file.
            if ! fetch_output="$(
              python3 - "$requested_url" "$body_file" <<'PY'
          import sys
          import time
          import re
          from urllib.parse import urlparse

          from curl_cffi import requests


          INTERSTITIAL_MARKERS = (
              "please wait",
              "please, wait",
              "wait a moment",
              "hold on",
              "just a moment",
              "checking your browser",
              "checking if the site connection is secure",
              "verifying your browser",
              "security verification",
              "veuillez patienter",
              "patientez",
              "un instant",
              "cf-chl-",
          )

          def page_text(content):
              if isinstance(content, bytes):
                  return content.decode("utf-8", errors="ignore").lower()
              return str(content).lower()


          def has_wait_marker(content):
              source = page_text(content)
              title_match = re.search(
                  r"<title\b[^>]*>(.*?)</title>",
                  source,
                  re.I | re.S,
              )
              title = re.sub(
                  r"[^a-z0-9]+",
                  " ",
                  title_match.group(1) if title_match else "",
              ).strip()
              without_scripts = re.sub(
                  r"<(?:script|style)\b[^>]*>.*?</(?:script|style)>",
                  " ",
                  source,
                  flags=re.I | re.S,
              )
              visible_text = re.sub(r"<[^>]+>", " ", without_scripts)
              visible_text = " ".join(visible_text.split())
              leading_text = visible_text[:500]
              if (
                  "cf-chl-" in source
                  or any(
                      marker in title or marker in leading_text
                      for marker in INTERSTITIAL_MARKERS
                      if marker != "cf-chl-"
                  )
                  or any(
                      word in title
                      for word in (
                          "wait",
                          "checking",
                          "verification",
                          "verifying",
                          "redirecting",
                          "loading",
                      )
                  )
              ):
                  return True

              scripted_shell = (
                  "<script" in source
                  and len(visible_text) < 180
                  and len(re.findall(r"<a\b", source, re.I)) <= 1
                  and not re.search(r"<(?:form|main|article)\b", source, re.I)
              )
              return scripted_shell


          def is_interstitial(content):
              return has_wait_marker(content)


          def fetch_with_chrome(url):
              from selenium import webdriver
              from selenium.webdriver.chrome.options import Options

              options = Options()
              options.add_argument("--headless=new")
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              options.add_argument("--disable-blink-features=AutomationControlled")
              options.add_argument("--lang=fr-FR")
              options.add_argument("--window-size=1365,768")
              options.add_argument("--proxy-server=socks5://127.0.0.1:9050")
              options.add_experimental_option(
                  "excludeSwitches",
                  ["enable-automation"],
              )
              options.add_experimental_option("useAutomationExtension", False)

              driver = webdriver.Chrome(options=options)
              try:
                  driver.set_page_load_timeout(60)
                  browser = driver.execute_cdp_cmd("Browser.getVersion", {})
                  user_agent = browser["userAgent"].replace(
                      "HeadlessChrome/",
                      "Chrome/",
                  )
                  driver.execute_cdp_cmd(
                      "Network.setUserAgentOverride",
                      {
                          "userAgent": user_agent,
                          "acceptLanguage": "fr-FR,fr;q=0.9,en;q=0.7",
                          "platform": "Linux x86_64",
                      },
                  )
                  driver.execute_cdp_cmd(
                      "Page.addScriptToEvaluateOnNewDocument",
                      {
                          "source": (
                              "Object.defineProperty(navigator, 'webdriver', "
                              "{get: () => undefined});"
                          ),
                      },
                  )
                  driver.get(url)

                  # Wait for challenges, meta-refresh pages and JavaScript
                  # redirect interstitials. A final page must then remain
                  # stable for two seconds before it is returned.
                  deadline = time.monotonic() + 40
                  stable_since = None
                  previous_url = None

                  while time.monotonic() < deadline:
                      current_url = driver.current_url
                      source = driver.page_source
                      normalized_source = source.lower()
                      challenge = is_interstitial(source)
                      meta_refresh = driver.execute_script(
                          "return Boolean(document.querySelector("
                          "'meta[http-equiv=refresh i]'));"
                      )

                      waiting_text = any(
                          marker in normalized_source
                          for marker in (
                              "please wait",
                              "redirecting",
                              "redirection",
                          )
                      )
                      javascript_redirect = waiting_text and bool(
                          re.search(
                              r"(?:window\.)?location(?:\.href)?\s*=|"
                              r"location\.(?:replace|assign)\s*\(",
                              source,
                              re.I,
                          )
                      )

                      if challenge or meta_refresh or javascript_redirect:
                          stable_since = None
                      elif current_url != previous_url:
                          stable_since = time.monotonic()
                      elif stable_since is None:
                          stable_since = time.monotonic()
                      elif time.monotonic() - stable_since >= 2:
                          break

                      previous_url = current_url
                      time.sleep(1)

                  content = driver.page_source.encode("utf-8")
                  if is_interstitial(content):
                      raise RuntimeError(
                          "Browser remained on an interstitial page"
                      )

                  status = driver.execute_script(
                      "const nav = performance.getEntriesByType('navigation')[0];"
                      "return nav ? nav.responseStatus : 0;"
                  )
                  return (
                      driver.current_url,
                      int(status or 200),
                      content,
                  )
              finally:
                  driver.quit()

          def fetch_with_circuit(url, circuit):
              # IsolateSOCKSAuth gives every username a separate Tor circuit.
              # DNS resolution is also performed by Tor through socks5h.
              proxy = (
                  f"socks5h://keeplink-{circuit}:isolated@127.0.0.1:9050"
              )
              try:
                  response = requests.get(
                      url,
                      impersonate="chrome",
                      headers={
                          "Accept": "text/html,application/xhtml+xml;q=0.9,*/*;q=0.8",
                          "Accept-Language": "fr-FR,fr;q=0.9,en;q=0.7",
                      },
                      proxies={"http": proxy, "https": proxy},
                      allow_redirects=True,
                      timeout=60,
                  )
              except requests.RequestsError as error:
                  print(
                      f"Tor circuit {circuit}: {type(error).__name__}",
                      file=sys.stderr,
                  )
                  return None

              ray = response.headers.get("cf-ray", "absent")
              print(
                  f"Tor circuit {circuit}: HTTP {response.status_code}; "
                  f"CF-Ray={ray}",
                  file=sys.stderr,
              )
              return response


          requested_url, body_file = sys.argv[1:]
          response = None

          # Try several independent European Tor exits. An HTTP 200 challenge
          # is not a usable response and must not be mistaken for a live site.
          for circuit in range(1, 7):
              candidate = fetch_with_circuit(requested_url, circuit)
              if candidate is None:
                  continue
              response = candidate
              if (
                  candidate.status_code not in (403, 429)
                  and candidate.status_code < 500
                  and not has_wait_marker(candidate.content)
              ):
                  break

          if response is None:
              raise RuntimeError("No HTTP response")

          if (
              response.status_code in (403, 429)
              or response.status_code >= 500
              or is_interstitial(response.content)
          ):
              final_url, status_code, content = fetch_with_chrome(requested_url)
              print(
                  f"Tor Chrome: HTTP {status_code}",
                  file=sys.stderr,
              )
              redirect_urls = [requested_url, final_url]
          else:
              final_url = response.url
              status_code = response.status_code
              content = response.content
              if len(response.history) > 10:
                  raise RuntimeError("Too many redirects")
              redirect_urls = [item.url for item in [*response.history, response]]

          if any(urlparse(url).scheme != "https" for url in redirect_urls):
              raise RuntimeError("Refusing a non-HTTPS redirect")

          with open(body_file, "wb") as output:
              output.write(content)

          print(final_url)
          print(status_code)
          PY
            )"; then
              return 1
            fi

            effective_url="$(sed -n '1p' <<< "$fetch_output")"
            status_code="$(sed -n '2p' <<< "$fetch_output")"
          }

          page_announces_move() {
            local body_file="$1"

            python3 - "$body_file" <<'PY'
          import html
          import re
          import sys
          import unicodedata

          with open(sys.argv[1], "r", encoding="utf-8", errors="ignore") as file:
              source = file.read()

          source = html.unescape(source)
          source = source.replace("\\/", "/")
          source = re.sub(r"\\u002f", "/", source, flags=re.I)

          normalized = unicodedata.normalize("NFKD", source)
          normalized = "".join(
              character for character in normalized
              if not unicodedata.combining(character)
          ).lower()

          patterns = [
              r"a\s+change\s+d['’]adresse",
              r"ancienne\s+adresse\s+n['’]est\s+plus\s+utilisee",
              r"redirection\s+dans\s+[0-9]+\s*s",
              r"nouvelle\s+adresse",
              r"url\s+en\s+vigueur",
              r"ouvrir\s+le\s+site",
              r"acceder\s+maintenant",
              r"acceder\s+a\s+la\s+page\s+d['’]accueil",
              r"redirection\s+securisee\s+vers",
          ]

          redirect_patterns = (
              r"<meta\b[^>]*http-equiv\s*=\s*['\"]?refresh['\"]?[^>]*"
              r"content\s*=\s*['\"][^'\"]*url\s*=",
              r"<meta\b[^>]*content\s*=\s*['\"][^'\"]*url\s*=[^>]*"
              r"http-equiv\s*=\s*['\"]?refresh",
              r"(?:window\.)?location(?:\.href)?\s*=\s*['\"]https://",
              r"location\.(?:replace|assign)\s*\(\s*['\"]https://",
          )

          found = (
              any(re.search(pattern, normalized) for pattern in patterns)
              or any(
                  re.search(pattern, source, re.I | re.S)
                  for pattern in redirect_patterns
              )
          )
          raise SystemExit(0 if found else 1)
          PY
          }

          page_is_interstitial() {
            local body_file="$1"

            python3 - "$body_file" <<'PY'
          import html
          import re
          import sys
          import unicodedata

          with open(sys.argv[1], "r", encoding="utf-8", errors="ignore") as file:
              source = html.unescape(file.read())

          normalized = unicodedata.normalize("NFKD", source)
          normalized = "".join(
              character for character in normalized
              if not unicodedata.combining(character)
          ).lower()

          markers = (
              "please wait",
              "please, wait",
              "wait a moment",
              "hold on",
              "just a moment",
              "checking your browser",
              "checking if the site connection is secure",
              "verifying your browser",
              "security verification",
              "veuillez patienter",
              "patientez",
              "un instant",
              "cf-chl-",
          )

          title_match = re.search(
              r"<title\b[^>]*>(.*?)</title>",
              normalized,
              re.I | re.S,
          )
          title = re.sub(
              r"[^a-z0-9]+",
              " ",
              title_match.group(1) if title_match else "",
          ).strip()
          without_scripts = re.sub(
              r"<(?:script|style)\b[^>]*>.*?</(?:script|style)>",
              " ",
              normalized,
              flags=re.I | re.S,
          )
          visible_text = re.sub(r"<[^>]+>", " ", without_scripts)
          visible_text = " ".join(visible_text.split())
          leading_text = visible_text[:500]
          if (
              "cf-chl-" in normalized
              or any(
                  marker in title or marker in leading_text
                  for marker in markers
                  if marker != "cf-chl-"
              )
              or any(
                  word in title
                  for word in (
                      "wait",
                      "checking",
                      "verification",
                      "verifying",
                      "redirecting",
                      "loading",
                  )
              )
          ):
              raise SystemExit(0)

          if (
              "<script" in normalized
              and len(visible_text) < 180
              and len(re.findall(r"<a\b", normalized, re.I)) <= 1
              and not re.search(r"<(?:form|main|article)\b", normalized, re.I)
          ):
              raise SystemExit(0)

          raise SystemExit(1)
          PY
          }

          extract_announced_target() {
            local body_file="$1"
            local base_url="$2"

            python3 - "$body_file" "$base_url" <<'PY'
          import html
          import re
          import sys
          import unicodedata
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlparse

          filename = sys.argv[1]
          base_url = sys.argv[2]

          with open(filename, "r", encoding="utf-8", errors="ignore") as file:
              source = file.read()

          source = html.unescape(source)
          source = source.replace("\\/", "/")
          source = re.sub(r"\\u002f", "/", source, flags=re.I)

          def normalize(value):
              value = unicodedata.normalize("NFKD", value)
              value = "".join(
                  character for character in value
                  if not unicodedata.combining(character)
              )
              return " ".join(value.lower().split())

          class PageParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.current_link = None
                  self.links = []
                  self.text = []
                  self.refreshes = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  tag = tag.lower()

                  if tag == "a":
                      self.current_link = {
                          "href": attributes.get("href", ""),
                          "text": [],
                      }

                  if (
                      tag == "meta"
                      and attributes.get("http-equiv", "").lower() == "refresh"
                  ):
                      self.refreshes.append(attributes.get("content", ""))

              def handle_data(self, data):
                  self.text.append(data)

                  if self.current_link is not None:
                      self.current_link["text"].append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self.current_link is not None:
                      self.links.append((
                          self.current_link["href"],
                          " ".join(self.current_link["text"]),
                      ))
                      self.current_link = None

          parser = PageParser()
          parser.feed(source)

          candidates = []
          candidate_index = 0
          allowed_sources = {
              "explicit_cta",
              "announced_address",
              "meta_refresh",
              "javascript_redirect",
          }

          def add_candidate(value, priority, source_kind):
              global candidate_index

              if source_kind not in allowed_sources:
                  return

              value = html.unescape(value).strip()
              value = value.rstrip("\"'<>),.;")

              if not value:
                  return

              candidates.append((
                  priority,
                  candidate_index,
                  urljoin(base_url, value),
              ))
              candidate_index += 1

          # Boutons explicitement destinés à ouvrir la nouvelle adresse.
          preferred_labels = (
              "ouvrir le site",
              "acceder maintenant",
              "acceder a la page d'accueil",
              "acceder a la page d’accueil",
              "acceder au site",
              "visiter le site",
              "continuer vers le site",
          )

          for href, label in parser.links:
              normalized_label = normalize(label)

              if any(text in normalized_label for text in preferred_labels):
                  add_candidate(href, 1000, "explicit_cta")

          # Adresse écrite après les indications AfterDark.
          visible_text = " ".join(parser.text)

          for pattern in (
              r"url\s+en\s+vigueur.{0,250}?(https://[a-z0-9.-]+)",
              r"nouvelle\s+adresse.{0,250}?(https://[a-z0-9.-]+)",
          ):
              for match in re.finditer(pattern, visible_text, re.I | re.S):
                  add_candidate(match.group(1), 900, "announced_address")

          # Redirections HTML.
          for refresh in parser.refreshes:
              match = re.search(r"url\s*=\s*([^;]+)", refresh, re.I)

              if match:
                  add_candidate(match.group(1), 850, "meta_refresh")

          # Redirections JavaScript utilisées par certaines anciennes pages.
          javascript_patterns = (
              r"(?:window\.)?location(?:\.href)?\s*=\s*['\"](https://[^'\"]+)",
              r"location\.replace\(\s*['\"](https://[^'\"]+)",
              r"location\.assign\(\s*['\"](https://[^'\"]+)",
          )

          for pattern in javascript_patterns:
              for match in re.finditer(pattern, source, re.I):
                  add_candidate(match.group(1), 800, "javascript_redirect")

          # No fallback over ordinary links or arbitrary HTTPS URLs. Only the
          # four explicit redirect sources above are eligible.
          base_parsed = urlparse(base_url)
          base_host = (base_parsed.hostname or "").lower()
          base_port = f":{base_parsed.port}" if base_parsed.port else ""
          base_path = base_parsed.path or "/"
          normalized_base = f"https://{base_host}{base_port}{base_path}"
          if base_parsed.query:
              normalized_base += f"?{base_parsed.query}"

          for _, _, candidate in sorted(
              candidates,
              key=lambda item: (-item[0], item[1]),
          ):
              parsed = urlparse(candidate)

              if parsed.scheme != "https" or not parsed.hostname:
                  continue

              candidate_host = parsed.hostname.lower()

              # Évite les liens sociaux présents sur les pages d'annonce.
              if candidate_host in {
                  "t.me",
                  "telegram.me",
                  "facebook.com",
                  "www.facebook.com",
                  "instagram.com",
                  "www.instagram.com",
                  "discord.gg",
              }:
                  continue

              port = f":{parsed.port}" if parsed.port else ""
              path = parsed.path or "/"
              normalized_candidate = f"https://{candidate_host}{port}{path}"
              if parsed.query:
                  normalized_candidate += f"?{parsed.query}"

              # An explicit same-origin route such as /go or /redirect is
              # valid and must be fetched because it can perform the actual
              # cross-origin redirect. Only an exact self-link is rejected.
              if normalized_candidate == normalized_base:
                  continue

              print(normalized_candidate)
              sys.exit(0)

          sys.exit(1)
          PY
          }

          resolve_file() {
            local file="$1"
            local current_url
            local current_origin
            local candidate_url
            local candidate_origin
            local effective_origin
            local next_url
            local resolved_url=""
            local body_file="$temp_dir/${file//\//_}.html"
            local -A visited=()

            current_url="$(
              awk 'NF {
                sub(/\r$/, "")
                print
                exit
              }' "$file"
            )"

            if ! current_origin="$(url_origin "$current_url")"; then
              echo "::error file=$file::$file must contain a valid HTTPS URL"
              return 1
            fi

            candidate_url="$current_origin"

            for _ in {1..8}; do
              if [[ -n "${visited[$candidate_url]+present}" ]]; then
                echo "::warning file=$file::Redirect loop detected at $candidate_url"
                return 0
              fi

              visited["$candidate_url"]=1

              if ! candidate_origin="$(url_origin "$candidate_url")"; then
                echo "::warning file=$file::Candidate URL could not be parsed"
                return 0
              fi

              if ! fetch_page "$candidate_url" "$body_file"; then
                echo "$file: $candidate_url could not be reached; unchanged."
                return 0
              fi

              if [[ ! "$status_code" =~ ^2[0-9][0-9]$ ]]; then
                echo "$file: HTTP $status_code; unchanged."
                return 0
              fi

              if page_is_interstitial "$body_file"; then
                echo "$file: unresolved verification page; unchanged."
                return 0
              fi

              if ! effective_origin="$(url_origin "$effective_url")"; then
                echo "::warning file=$file::Effective URL could not be parsed"
                return 0
              fi

              # If the HTTP client or Chrome has already navigated to another
              # HTTPS origin and the resulting page is no longer an
              # interstitial, that navigation itself is the resolution. Do
              # not scan the destination page for another external link: it
              # may contain advertisements unrelated to the address change.
              if [[ "$effective_origin" != "$candidate_origin" ]]; then
                resolved_url="$effective_origin"
                echo "$file: browser reached final origin: $resolved_url"
                break
              fi

              # Une véritable redirection HTTP a déjà été suivie par le client.
              # Si la page obtenue n'annonce aucun autre déplacement, elle
              # devient immédiatement l'adresse finale.
              if ! page_announces_move "$body_file"; then
                resolved_url="$effective_origin"
                break
              fi

              next_url="$(
                extract_announced_target "$body_file" "$effective_url" ||
                true
              )"

              if [[ -z "$next_url" ]]; then
                echo "$file: move announced but no usable target found; unchanged."
                return 0
              fi

              echo "$file: announcement found: $effective_origin -> $next_url"
              candidate_url="$next_url"
            done

            if [[ -z "$resolved_url" ]]; then
              echo "$file: too many consecutive announcements; unchanged."
              return 0
            fi

            if [[ "$resolved_url" == "$current_url" ]]; then
              echo "$file is already current: $current_url"
              return 0
            fi

            printf '%s\n' "$resolved_url" > "$file"
            echo "$file updated: $current_url -> $resolved_url"
          }

          failed=false

          for file in "${files[@]}"; do
            echo "Checking $file"

            if ! resolve_file "$file"; then
              failed=true
            fi
          done

          if [[ "$failed" == true ]]; then
            exit 1
          fi

          if git diff --quiet -- "${files[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated URLs
        if: steps.keep-links.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- KeepLink*.txt
          git commit -m "chore: update KeepLink redirects"
          git push
